services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ortos}
      POSTGRES_USER: ${POSTGRES_USER:-ortos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD before running docker compose}
    volumes:
      - ortos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../API
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/ortos}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-ortos}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD before running docker compose}}
      ORTOS_JWT_SECRET: ${ORTOS_JWT_SECRET:?Define ORTOS_JWT_SECRET before running docker compose}
      ORTOS_CORS_ALLOWED_ORIGINS: ${ORTOS_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../Web
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  ortos-postgres-data:
