services:
  api:
    build:
      context: ../API
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?Define SPRING_DATASOURCE_URL before running docker compose}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?Define SPRING_DATASOURCE_USERNAME before running docker compose}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Define SPRING_DATASOURCE_PASSWORD before running docker compose}
      ORTOS_JWT_SECRET: ${ORTOS_JWT_SECRET:?Define ORTOS_JWT_SECRET before running docker compose}
      ORTOS_CORS_ALLOWED_ORIGINS: ${ORTOS_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"

  web:
    build:
      context: ../Web
    depends_on:
      - api
    ports:
      - "3000:80"
