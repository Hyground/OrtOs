<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        var ortosTheme = localStorage.getItem('ortos.theme') || 'system';
        var ortosDark = ortosTheme === 'dark' || (!['light', 'dark'].includes(ortosTheme) && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = ortosDark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = ortosDark ? 'dark' : 'light';
      } catch (_) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0284c7" />
    <meta
      name="description"
      content="OrtOs, tu clínica dental de confianza: odontología estética en un ambiente confortable."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OrtOs" />
    <meta property="og:title" content="OrtOs" />
    <meta property="og:description" content="Tu clínica dental de confianza." />
    <meta property="og:locale" content="es_GT" />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>OrtOs</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
