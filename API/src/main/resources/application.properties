spring.application.name=ortos-api
server.port=8080

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# V1-V3 are immutable historical migrations. New migrations are discovered from
# the owning module folder; see db/migration/README.md for the reserved ranges.
spring.flyway.locations=classpath:db/migration,classpath:db/migration/patients,classpath:db/migration/staff,classpath:db/migration/appointments,classpath:db/migration/clinical,classpath:db/migration/finance

ortos.jwt.expiration-hours=24
