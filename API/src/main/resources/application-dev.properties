spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ortos_dev}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ortos}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Debe configurarse fuera del repositorio; no hay secreto de respaldo.
ortos.jwt.secret=${ORTOS_JWT_SECRET}
ortos.cors.allowed-origins=${ORTOS_CORS_ALLOWED_ORIGINS:http://localhost:5173,null}
ortos.seed.enabled=${ORTOS_SEED_ENABLED:false}
